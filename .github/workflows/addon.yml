# Emkay Home as a Home Assistant add-on (ha-addon/emkay_home): built and
# started the way the Supervisor starts it – host network, its options in
# /data/options.json – and walked through like the normal house
# (tools/smoke.py); published to ghcr.io/emkay-voice/emkay-home-addon,
# tagged with the add-on's version, for amd64 and aarch64, from main.
name: Add-on

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f ha-addon/emkay_home/Dockerfile -t emkay-home-addon:ci .
      - name: Start it as the Supervisor would
        run: |
          docker volume create addon_data
          docker run --rm -v addon_data:/data alpine sh -c \
            'echo "{\"https_port\": 8443, \"http_port\": 8480, \"panel_port\": 8500, \"names\": \"\"}" > /data/options.json'
          docker run -d --name addon --network host -v addon_data:/data emkay-home-addon:ci
          for i in $(seq 90); do curl -sf http://127.0.0.1:8480/ca.crt >/dev/null && break; sleep 2; done
      - name: Wait for OpenVoiceOS (skills installed and loaded)
        run: |
          for i in $(seq 120); do
            docker exec addon ovos-hc -s skills >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "ovos_core never became healthy"; exit 1
      - name: Walk through it and pair an Emkay
        run: python3 tools/smoke.py "$(hostname -I | awk '{print $1}')" --http 8480 --https 8443 --panel 8500 > pairing.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ask the house
        run: |
          export NODE_EXTRA_CA_CERTS="$(python3 -c "import json;print(json.load(open('pairing.json'))['ca'])")"
          node tools/ask.mjs pairing.json "what time is it" 120
      - name: A restart asked for by the house page (what compose's restarter does)
        run: |
          before="$(docker exec addon /command/s6-svstat -p /run/service/ovos_core)"
          docker exec addon touch /data/requests/restart-ovos_core
          for i in $(seq 40); do
            now="$(docker exec addon /command/s6-svstat -p /run/service/ovos_core)"
            [ -n "$now" ] && [ "$now" != "-1" ] && [ "$now" != "$before" ] && { echo "ovos_core restarted: $before -> $now"; exit 0; }
            sleep 2
          done
          echo "ovos_core was not restarted"; exit 1
      - if: always()
        name: How the services are
        run: |
          for s in emkay_home ovos_messagebus ovos_core emkay_home_panel emkay_home_stt emkay_home_tts caddy restarter; do
            echo "$s: $(docker exec addon /command/s6-svstat /run/service/$s)"
          done
          docker logs addon > addon.log 2>&1; tail -150 addon.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: addon-log
          path: addon.log

  publish:
    if: github.event_name == 'push'
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          v=$(python3 -c "import yaml; print(yaml.safe_load(open('ha-addon/emkay_home/config.yaml'))['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ha-addon/emkay_home/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/emkay-voice/emkay-home-addon:${{ steps.version.outputs.version }}
            ghcr.io/emkay-voice/emkay-home-addon:latest
          cache-from: type=gha,scope=emkay-home-addon
          cache-to: type=gha,mode=max,scope=emkay-home-addon
