# Emkay Home as a Home Assistant add-on (ha-addon/emkay_home): built and
# started the way the Supervisor starts it – host network, its options in
# /data/options.json – and walked through like the normal house
# (tools/smoke.py); published to ghcr.io/emkay-voice/emkay-home-addon,
# tagged with the add-on's version, for amd64 and aarch64, from main.
name: Add-on

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f ha-addon/emkay_home/Dockerfile -t emkay-home-addon:ci .
      - name: Start it as the Supervisor would
        run: |
          docker volume create addon_data
          docker run --rm -v addon_data:/data alpine sh -c \
            'echo "{\"https_port\": 8443, \"http_port\": 8480, \"panel_port\": 8500, \"names\": \"\"}" > /data/options.json'
          docker run -d --name addon --network host -v addon_data:/data emkay-home-addon:ci
          for i in $(seq 90); do curl -sf http://127.0.0.1:8480/ca.crt >/dev/null && break; sleep 2; done
      - name: Walk through it
        run: python3 tools/smoke.py "$(hostname -I | awk '{print $1}')" --http 8480 --https 8443 --panel 8500
      - name: OVOS is running too
        run: |
          for i in $(seq 60); do docker logs addon 2>&1 | grep -q "Starting ovos-core" && break; sleep 2; done
          docker exec addon /command/s6-svstat /run/service/ovos_core /run/service/ovos_messagebus /run/service/emkay_home_panel
      - if: always()
        run: docker logs addon 2>&1 | tail -200

  publish:
    if: github.event_name == 'push'
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(sed -n 's/^version: *\"\(.*\)\"/\1/p' ha-addon/emkay_home/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ha-addon/emkay_home/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/emkay-voice/emkay-home-addon:${{ steps.version.outputs.version }}
            ghcr.io/emkay-voice/emkay-home-addon:latest
          cache-from: type=gha,scope=emkay-home-addon
          cache-to: type=gha,mode=max,scope=emkay-home-addon
