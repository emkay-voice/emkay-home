# The installer on many Linux distributions – the way a person runs it, on a
# machine where Docker isn't there yet.
#
# Each distribution runs as a "machine": a privileged container booted with
# its own init (systemd, or OpenRC on Alpine), ports 80/443 published, with
# nothing but curl, bash and iproute2 added. Inside it the installer installs
# Docker (get.docker.com, the distribution's packages, …), sets up Emkay Home
# and starts it; then tools/smoke.py walks through the house from the runner.
# The arm64 rows run on GitHub's arm runners (as on a Raspberry Pi 4/5).
#
# To add a distribution: a row in the matrix – its image, how to add
# systemd/curl/iproute2 ("prep") and its init. The emkay.ai/home/ page lists
# what is tested here.
name: Distributions

on:
  push:
    branches: [main]
    paths: [install/**, compose/**, caddy/**, .github/workflows/distros.yml]
  pull_request:
    paths: [install/**, compose/**, caddy/**, .github/workflows/distros.yml]
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"   # weekly: distributions move on without us

jobs:
  install:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Debian family ---------------------------------------------------
          - name: Debian 12
            image: debian:12
            prep: apt-get update && apt-get install -y systemd systemd-sysv curl iproute2 ca-certificates
          - name: Debian 13
            image: debian:13
            prep: apt-get update && apt-get install -y systemd systemd-sysv curl iproute2 ca-certificates
          - name: Debian 12 arm64 (as Raspberry Pi OS)
            image: debian:12
            runner: ubuntu-24.04-arm
            prep: apt-get update && apt-get install -y systemd systemd-sysv curl iproute2 ca-certificates
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            prep: apt-get update && apt-get install -y systemd systemd-sysv curl iproute2 ca-certificates
          - name: Ubuntu 24.04 arm64
            image: ubuntu:24.04
            runner: ubuntu-24.04-arm
            prep: apt-get update && apt-get install -y systemd systemd-sysv curl iproute2 ca-certificates
          # Mint's own images say "Ubuntu" in /etc/os-release, which would test
          # Ubuntu's way again; Mint 22 is Ubuntu 24.04 underneath, so give
          # Ubuntu 24.04 Mint's os-release and test Mint's way (its docker.io)
          - name: Linux Mint 22
            image: ubuntu:24.04
            prep: >-
              apt-get update && apt-get install -y systemd systemd-sysv curl iproute2 ca-certificates &&
              printf 'NAME="Linux Mint"\nVERSION="22 (Wilma)"\nID=linuxmint\nID_LIKE="ubuntu debian"\nPRETTY_NAME="Linux Mint 22"\nVERSION_ID="22"\nUBUNTU_CODENAME=noble\n' > /etc/os-release
          # --- Fedora / RHEL family -----------------------------------------------
          - name: Fedora
            image: fedora:latest
            prep: dnf -y install systemd curl iproute procps-ng
          - name: Rocky Linux 9
            image: rockylinux/rockylinux:9
            prep: dnf -y install --allowerasing systemd curl iproute procps-ng
          - name: AlmaLinux 9
            image: almalinux:9
            prep: dnf -y install --allowerasing systemd curl iproute procps-ng
          # --- Arch family ------------------------------------------------------------
          - name: Arch Linux
            image: archlinux:latest
            prep: pacman -Syu --noconfirm systemd curl iproute2
          - name: Manjaro
            image: manjarolinux/base:latest
            prep: pacman -Syu --noconfirm systemd curl iproute2
          # --- openSUSE ---------------------------------------------------------------
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed
            prep: zypper -n install systemd curl iproute2 gawk tar gzip
          - name: openSUSE Leap 15
            image: opensuse/leap:15
            prep: zypper -n install systemd-sysvinit curl iproute2 gawk tar gzip
          # --- Alpine (OpenRC, not systemd) ------------------------------------
          - name: Alpine
            image: alpine:latest
            init: /sbin/init
            prep: apk add bash curl iproute2 openrc && sed -i 's/^#rc_sys=.*/rc_sys="docker"/' /etc/rc.conf
    steps:
      - uses: actions/checkout@v4

      - name: Build the machine
        run: |
          init="${{ matrix.init || '/sbin/init' }}"
          printf 'FROM %s\nRUN %s\nCMD ["%s"]\n' "${{ matrix.image }}" "${{ matrix.prep }}" "$init" > Machinefile
          cat Machinefile
          docker build -q -t machine -f Machinefile .

      - name: Boot it
        run: |
          # its own network (its Docker makes its own docker0); the runner
          # reaches it at its address on the runner's docker0
          docker run -d --name machine --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v /lib/modules:/lib/modules:ro \
            -v /var/lib/docker -v /var/lib/containerd \
            --tmpfs /run --tmpfs /tmp -e container=docker machine
          sleep 8
          docker exec machine sh -c 'cat /etc/os-release | head -3'

      - name: Run the installer (as a person would, in Danish)
        run: |
          docker exec -e LANG=da_DK.UTF-8 machine bash -c \
            "curl -fsSL https://raw.githubusercontent.com/emkay-voice/emkay-home/${{ github.event.pull_request.head.sha || github.sha }}/install/home.sh | bash -s -- --ref ${{ github.event.pull_request.head.sha || github.sha }}"

      # by the machine's own address, as a phone on the LAN would (through a
      # published port the house would see another address than was asked for)
      - name: Walk through the house
        run: python3 tools/smoke.py "$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' machine)"

      - if: failure()
        name: What happened
        run: |
          docker exec machine cat /tmp/emkay-home-install.log | tail -80 || true
          docker exec machine docker compose --project-directory /opt/emkay-home/compose logs --no-color | tail -80 || true
