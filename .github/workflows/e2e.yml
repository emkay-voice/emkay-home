# The whole house, end to end: install it, wait for OpenVoiceOS to be ready,
# pair an Emkay and ask it something – does the house answer?
# (The other workflows walk through the page and pairing; this one needs the
# real ovos_core, its skills and the bus, and takes several minutes.)
name: End to end

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # this pull request's Emkay Home, built here (not the published image)
      - name: Install the house
        env:
          EMKAY_HOME_BUILD: "1"
        run: bash install/home.sh --ref "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Wait for OpenVoiceOS (skills installed and loaded)
        run: |
          DC="sudo docker compose --project-directory /opt/emkay-home/compose"
          for i in $(seq 1 120); do
            state="$($DC ps --format '{{.Service}} {{.State}} {{.Health}}' ovos_core)"
            echo "$(date +%T) $state"
            case "$state" in *healthy*) [ "${state##* }" = healthy ] && exit 0 ;; esac
            sleep 10
          done
          echo "ovos_core never became healthy"; exit 1

      - name: Pair an Emkay
        run: python3 tools/smoke.py "$(hostname -I | awk '{print $1}')" --panel 8500 > pairing.json

      - name: Ask the house
        run: |
          export NODE_EXTRA_CA_CERTS="$(python3 -c "import json;print(json.load(open('pairing.json'))['ca'])")"
          node tools/ask.mjs pairing.json "what time is it" 120

      # The house in Danish, as a person sets it up: the language on the page –
      # emkay_home then has ovos_core restarted (emkay_home_restarter) to load
      # its skills in that language.
      - name: The house in Danish
        run: |
          DC="sudo docker compose --project-directory /opt/emkay-home/compose"
          python3 - <<'EOF'
          import json, ssl, urllib.request, http.cookiejar, subprocess
          ip = subprocess.check_output("hostname -I", shell=True, text=True).split()[0]
          ca = json.load(open("pairing.json"))["ca"]
          o = urllib.request.build_opener(urllib.request.HTTPSHandler(context=ssl.create_default_context(cafile=ca)),
                                          urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def api(p, b):
              r = urllib.request.Request(f"https://{ip}{p}", data=json.dumps(b).encode(), headers={"Content-Type": "application/json"})
              return json.loads(o.open(r).read())
          api("/api/login", {"password": "emkay-smoke"}); print(api("/api/lang", {"lang": "da-dk"}))
          EOF
          sudo docker exec ovos_core cat /home/ovos/.config/mycroft/mycroft.conf | head -5
          before="$(sudo docker inspect -f '{{.State.StartedAt}}' ovos_core)"
          for i in $(seq 1 30); do
            [ "$(sudo docker inspect -f '{{.State.StartedAt}}' ovos_core)" != "$before" ] && echo "ovos_core restarted" && break
            sleep 2
          done
          [ "$(sudo docker inspect -f '{{.State.StartedAt}}' ovos_core)" != "$before" ] || { echo "ovos_core was not restarted"; $DC logs emkay_home_restarter; exit 1; }
          sleep 20
          for i in $(seq 1 60); do
            state="$($DC ps --format '{{.Health}}' ovos_core)"; echo "$(date +%T) $state"
            [ "$state" = healthy ] && break; sleep 10
          done
          python3 tools/smoke.py "$(hostname -I | awk '{print $1}')" > pairing-da.json
          export NODE_EXTRA_CA_CERTS="$(python3 -c "import json;print(json.load(open('pairing-da.json'))['ca'])")"
          node tools/ask.mjs pairing-da.json "hvad er klokken" 120

      - if: always()
        name: What the house did
        run: |
          DC="sudo docker compose --project-directory /opt/emkay-home/compose"
          $DC ps
          for s in ovos_core ovos_messagebus emkay_home emkay_home_restarter; do echo "=== $s"; $DC logs --no-color --tail 120 $s; done
