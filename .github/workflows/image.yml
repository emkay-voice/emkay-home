# The emkay-home image: built and walked through (tools/smoke.py behind a
# real Caddy) on every push and pull request; published to
# ghcr.io/emkay-voice/emkay-home for amd64 and arm64 (Pi 4/5) from main and
# from tags (vX.Y.Z).
name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/emkay-voice/emkay-home

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f image/Dockerfile -t emkay-home:ci .
      - name: Start the house (emkay_home + Caddy, ports 8080/8443)
        run: |
          docker run -d --name emkay_home --network host -e HTTP_PORT=8080 -e HTTPS_PORT=8443 emkay-home:ci
          docker run -d --name caddy --network host -e HTTP_PORT=8080 -e HTTPS_PORT=8443 \
            -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2
          for i in $(seq 30); do curl -sf http://127.0.0.1:8080/ca.crt >/dev/null && break; sleep 1; done
      - name: Walk through it
        run: python3 tools/smoke.py "$(hostname -I | awk '{print $1}')" --http 8080 --https 8443
      - if: always()
        run: docker logs emkay_home; docker logs caddy

  # The installer, the way a person runs it (Docker is already there on the
  # runner), then the same walk-through as above against what it set up.
  # Twice: once pulling Emkay Home's image (logged in, in case it isn't
  # public), once without – where the installer must build it itself.
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [pull, build]
    steps:
      - uses: actions/checkout@v4
      - name: Allow pulling Emkay Home's image
        if: matrix.image == 'pull'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Make sure no image can be pulled
        if: matrix.image == 'build'
        run: echo "EMKAY_HOME_BUILD=1" >> "$GITHUB_ENV"
      - name: Install
        run: bash install/home.sh --ref "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Walk through it
        run: python3 tools/smoke.py "$(hostname -I | awk '{print $1}')"
      - if: always()
        run: cat /tmp/emkay-home-install.log; sudo docker compose --project-directory /opt/emkay-home/compose logs --no-color emkay_home caddy | tail -100

  publish:
    if: github.event_name == 'push'
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
